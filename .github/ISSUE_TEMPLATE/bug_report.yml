name: Bug report
description: Something broke, or does not work the way the docs say it should.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        1. Ran `husk up demo --provider local`
        2. Expected a computer to start
        3. Got error: ...
    validations:
      required: true

  - type: textarea
    id: doctor-output
    attributes:
      label: "`husk doctor` output"
      description: >-
        Paste the output of `npx @husk-ai/cli doctor --json`. It reports the husk
        version, your Node version, your platform and which providers resolved, so
        it covers every field below. If `doctor` itself is what failed, paste that
        error instead.
      render: json
    validations:
      required: false

  - type: input
    id: husk-version
    attributes:
      label: Husk version
      description: Only needed if you could not attach the `doctor` output.
      placeholder: "0.1.1"
    validations:
      required: false

  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Only needed if you could not attach the `doctor` output.
      placeholder: "22.x"
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "Windows 11, Ubuntu 24.04, macOS 15, etc."
    validations:
      required: false

  - type: dropdown
    id: provider
    attributes:
      label: Computer provider
      description: The one you were trying to use, if the bug is provider-specific.
      options:
        - docker
        - podman
        - "local (WSL2)"
        - "local (POSIX)"
        - ssh
        - fly
        - "not applicable"
    validations:
      required: false
